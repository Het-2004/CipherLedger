services:

  mongodb:
    image: mongo:latest
    container_name: cipherledger-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db


  backend:
    build: .
    container_name: cipherledger-backend

    ports:
      - "8080:8080"

    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://cipherledger-mongodb:27017/cipherledger

    depends_on:
      - mongodb


  frontend:
    build: ./cipherledger-ui

    container_name: cipherledger-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  mongo-data: