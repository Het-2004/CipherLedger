name: CipherLedger CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Unit Tests
      run: mvn -B test

    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cipherledger-backend
        path: target/*.jar

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cipherledger-ui
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./cipherledger-ui/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Build Frontend
      run: npm run build

  docker-build:
    needs: [build-and-test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Backend Artifact
      uses: actions/download-artifact@v4
      with:
        name: cipherledger-backend
        path: target/

    - name: Build Backend Docker Image
      run: docker build -t cipherledger-backend:latest .

    - name: Build Frontend Docker Image
      run: cd cipherledger-ui && docker build -t cipherledger-frontend:latest .

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Simulated Auto Deploy
      run: |
        echo "🚀 Starting Deployment Process..."
        echo "Typically, you would authenticate to your cloud provider (AWS/DigitalOcean) here."
        echo "Example (SSH to server):"
        echo "ssh user@your-server.com 'cd /opt/cipherledger && git pull && docker-compose up -d --build'"
        echo "✅ Deployment Successful!"
