server.port=8080

spring.application.name=CipherLedger

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cipherledger}

# SIEM Logback Configuration
logging.config=classpath:logback-spring.xml

# Redis Caching
spring.data.redis.host=localhost
spring.data.redis.port=6379

# P2P Configuration
cipherledger.p2p.port=9000
# Leave seed-nodes empty to run as a standalone node (no Connection Refused errors).
# For multi-node: cipherledger.p2p.seed-nodes=localhost:9001,localhost:9002
cipherledger.p2p.seed-nodes=

# Actuator / Prometheus Monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true